# The formatter multiplexer - https://github.com/numtide/treefmt

# Do not exit with error if a configured formatter is missing
Env $TREEFMT_ALLOW_MISSING_FORMATTER
allow-missing-formatter = true

# The file into which a cpu profile will be written
Env $TREEFMT_CPU_PROFILE
cpu-profile = ./cpu.pprof

Env $TREEFMT_WALK
tree-root-file = "flake.nix"

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.yamlfmt]
command = "yamlfmt"
includes = ["*.yaml", "*.yml"]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.mdformat]
command = "mdformat"
includes = ["*.md"]

[formatter.shformat]
command = "shfmt"
options = ["-w"]
includes = ["*.sh", "*.bash"]

[formatter.jsonfmt]
command = "jsonfmt"
options = ["--write"]
includes = ["*.json"]

[formatter.cfmt]
command = "clang-format"
options = ["-i"]
includes = ["*.c", "*.cc", "*.cpp", "*.h"]

[formatter.pyfmt]
command = "ruff"
options = ["format"]
includes = ["*.py", "*.pyi"]

